appId: com.flodisterhoft.snag
productName: Snag
directories:
  buildResources: build
  output: dist
files:
  # Explicit allowlist: never package local agent settings, source, tests,
  # docs, scripts, repository metadata, or other workspace files in app.asar.
  - out/**/*
  - resources/tray.png
  - package.json
  - LICENSE
  - CHANGELOG.md
extraResources:
  - from: build/tools
    to: tools
    filter:
      - yt-dlp.exe
      - yt-dlp-LICENSE.txt
      - yt-dlp-THIRD_PARTY_LICENSES.txt
      - ffmpeg.exe
      - ffmpeg-COPYING.GPLv3.txt
      - ffmpeg-BUILD-README.txt
      - aria2c.exe
      - aria2-COPYING.txt
      - TOOLS_MANIFEST.json
      - THIRD_PARTY_TOOLS.txt
      - SOURCE_COMPLIANCE.md
  - from: extension
    to: extension
    filter:
      - manifest.json
      - background.js
      - config.js
      - content.js
      - content.css
      - README.md
      - icons/**/*
protocols:
  - name: Snag deep link
    schemes:
      - snag
# Embeds resources/app-update.yml so electron-updater knows where releases
# live. Publishing itself stays manual (gh release create with latest.yml).
publish:
  provider: github
  owner: flodisterhoft-ops
  repo: snag
win:
  target:
    - target: nsis
    - target: portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  # Preserve the deterministic GUID generated by the original app ID so this
  # attribution cleanup remains an in-place upgrade for existing installs.
  guid: ddbec942-e820-5cc0-b83e-2c3b76c02365
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Snag
portable:
  artifactName: ${productName}-${version}-portable.${ext}
